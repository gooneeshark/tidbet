    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            background-color: #000000;
            color: white;
            font-family: 'Kanit', sans-serif;
            overflow-x: hidden;
        }

        /* --- TICKER STYLES --- */
        .topbar-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100px;
            z-index: 9999;
            background: #000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            cursor: grab;
            -webkit-overflow-scrolling: touch;
        }
        .topbar-container::-webkit-scrollbar { display: none; }
        .topbar-container:active { cursor: grabbing; }
        .ticker-wrapper { display: flex; align-items: center; width: max-content; height: 100%; }
        .ticker-item {
            flex-shrink: 0; width: 240px; height: 100%;
            display: flex; position: relative; overflow: hidden;
            text-decoration: none; border-right: 1px solid rgba(255, 255, 255, 0.05);
            background: #111;
        }
        .item-image {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0.6; transition: opacity 0.4s ease;
        }
        .item-image:hover { opacity: 0.8; }
        .logo-box {
            position: absolute; top: 8px; left: 8px; width: 32px; height: 32px;
            background: rgba(255,255,255,0.95); border-radius: 6px;
            display: flex; align-items: center; justify-content: center; padding: 4px;
            transform: scale(0.7); transform-origin: top left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10;
        }

        /* --- MAIN APP OFFSET --- */
        #root {
            margin-top: 100px; /* ผลักเนื้อหาหลักลงมาให้พ้น Topbar */
            min-height: calc(100vh - 100px);
        }

        .skeleton {
            background: linear-gradient(90deg, #111 25%, #222 50%, #111 75%);
            background-size: 200% 100%; animation: skeleton-loading 1.5s infinite;
        }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <!-- INFINITE TOPBAR TICKER -->
    <nav class="topbar-container" id="topbar">
        <div class="ticker-wrapper" id="tickerWrapper">
            <!-- Skeletons while loading -->
            <div class="ticker-item skeleton"></div>
            <div class="ticker-item skeleton"></div>
            <div class="ticker-item skeleton"></div>
            <div class="ticker-item skeleton"></div>
            <div class="ticker-item skeleton"></div>
        </div>
    </nav>

    <!-- REACT APP ROOT (Goo Gemnee) -->
    <div id="root"></div>

    <!-- Scripts from Goo Gemnee Template -->
    <script type="module" src="/index.tsx"></script>
    
    <!-- Privacy Analytics -->
    <script data-collect-dnt="true" async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif?collect-dnt=true" alt="" referrerpolicy="no-referrer-when-downgrade"/></noscript>

    <!-- Ticker Logic Scripts -->
    <script>
        const API_URL = '/card.json';

        async function initTicker() {
            try {
                const res = await fetch(API_URL + '?t=' + Date.now());
                const data = await res.json();
                
                let originalItems = [];
                if (Array.isArray(data)) originalItems = data;
                else if (typeof data === 'object') {
                    originalItems = Object.values(data).find(v => Array.isArray(v)) || [data];
                }

                if (originalItems.length === 0) return;

                const wrapper = document.getElementById('tickerWrapper');
                wrapper.innerHTML = '';

                // Create sets for infinite loop feeling
                const tickerData = [...originalItems, ...originalItems, ...originalItems, ...originalItems];
                const frag = document.createDocumentFragment();

                tickerData.forEach((item) => {
                    const a = document.createElement('a');
                    a.href = item.url || '#';
                    a.target = "_blank";
                    a.draggable = false;
                    a.className = 'ticker-item';
                    a.innerHTML = `
                        <img src="${item.image}" class="item-image" loading="lazy" decoding="async" draggable="false" alt="Background">
                        <div class="logo-box" style="pointer-events: none;">
                            <img src="${item.logo}" class="w-full h-full object-contain" alt="Logo" onerror="this.src='https://www.google.com/s2/favicons?sz=64&domain=google.com'">
                        </div>
                    `;
                    frag.appendChild(a);
                });
                wrapper.appendChild(frag);

                startAutoScroll(originalItems.length);
            } catch (e) {
                console.error("Ticker load fail", e);
            }
        }

        function startAutoScroll(baseCount) {
            const container = document.getElementById('topbar');
            let isDown = false;
            let startX;
            let scrollLeft;
            let speed = 0.5;

            // Drag scroll events
            container.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - container.offsetLeft;
                scrollLeft = container.scrollLeft;
            });
            container.addEventListener('mouseleave', () => { isDown = false; });
            container.addEventListener('mouseup', () => { isDown = false; });
            container.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - container.offsetLeft;
                const walk = (x - startX) * 2;
                container.scrollLeft = scrollLeft - walk;
            });

            // Native Touch events
            container.addEventListener('touchstart', (e) => {
                isDown = true;
            }, {passive: true});
            container.addEventListener('touchend', () => { isDown = false; });

            function step() {
                if (!isDown) {
                    container.scrollLeft += speed;
                    
                    // Infinite wrap
                    const itemWidth = 240;
                    const oneSetWidth = itemWidth * baseCount;
                    
                    if (container.scrollLeft >= oneSetWidth * 2) {
                        container.scrollLeft -= oneSetWidth;
                    } else if (container.scrollLeft <= 0) {
                        container.scrollLeft += oneSetWidth;
                    }
                }
                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        // Delay the ticker initialization until after everything else is painted
        window.addEventListener('load', () => {
            setTimeout(initTicker, 500);
        });
    </script>
