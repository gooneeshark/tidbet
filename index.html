    <!-- Ticker Logic Scripts -->
    <script>
        const API_URL = '/card.json';

        async function initTicker() {
            try {
                const res = await fetch(API_URL + '?t=' + Date.now());
                const data = await res.json();

                let originalItems = [];
                if (Array.isArray(data)) originalItems = data;
                else if (typeof data === 'object') {
                    originalItems = Object.values(data).find(v => Array.isArray(v)) || [data];
                }

                if (originalItems.length === 0) return;

                const wrapper = document.getElementById('tickerWrapper');
                wrapper.innerHTML = '';

                // Create sets for infinite loop feeling
                const tickerData = [...originalItems, ...originalItems, ...originalItems, ...originalItems];
                const frag = document.createDocumentFragment();

                tickerData.forEach((item) => {
                    const a = document.createElement('a');
                    a.href = item.url || '#';
                    a.target = "_blank";
                    a.draggable = false;
                    a.className = 'ticker-item';
                    a.innerHTML = `
                        <img src="${item.image}" class="item-image" loading="lazy" decoding="async" draggable="false" alt="Background">
                        <div class="logo-box" style="pointer-events: none;">
                            <img src="${item.logo}" class="w-full h-full object-contain" alt="Logo" onerror="this.src='https://www.google.com/s2/favicons?sz=64&domain=google.com'">
                        </div>
                    `;
                    frag.appendChild(a);
                });
                wrapper.appendChild(frag);

                startAutoScroll(originalItems.length);
            } catch (e) {
                console.error("Ticker load fail", e);
            }
        }

        function startAutoScroll(baseCount) {
            const container = document.getElementById('topbar');
            let isDown = false;
            let startX;
            let scrollLeft;
            let speed = 0.5;

            // Drag scroll events
            container.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - container.offsetLeft;
                scrollLeft = container.scrollLeft;
            });
            container.addEventListener('mouseleave', () => { isDown = false; });
            container.addEventListener('mouseup', () => { isDown = false; });
            container.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - container.offsetLeft;
                const walk = (x - startX) * 2;
                container.scrollLeft = scrollLeft - walk;
            });

            // Native Touch events
            container.addEventListener('touchstart', (e) => {
                isDown = true;
            }, { passive: true });
            container.addEventListener('touchend', () => { isDown = false; });

            function step() {
                if (!isDown) {
                    container.scrollLeft += speed;

                    // Infinite wrap
                    const itemWidth = 240;
                    const oneSetWidth = itemWidth * baseCount;

                    if (container.scrollLeft >= oneSetWidth * 2) {
                        container.scrollLeft -= oneSetWidth;
                    } else if (container.scrollLeft <= 0) {
                        container.scrollLeft += oneSetWidth;
                    }
                }
                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        // Delay the ticker initialization until after everything else is painted
        window.addEventListener('load', () => {
            setTimeout(initTicker, 500);
        });

        // --- OpenWidget Integration ---
        async function loadOpenWidgetRecommendations() {
            try {
                const res = await fetch('/card.json?t=' + Date.now());
                const data = await res.json();

                let sites = [];
                if (data && Array.isArray(data.sites)) {
                    sites = data.sites;
                }

                if (sites.length === 0) return;

                // Map to a generic product recommendation format
                const products = sites.map(site => ({
                    title: site.name,
                    description: site.tagline,
                    url: site.url,
                    image: site.image || site.logo,
                    price: { value: 0, currency: 'THB' }
                }));

                // Push to OpenWidget configuration
                window.__ow = window.__ow || {};

                // Try different common properties for product recommendations
                window.__ow.product_recommendations = products;
                window.__ow.products = products;
                window.__ow.widget_content = window.__ow.widget_content || {};
                window.__ow.widget_content.product_recommendations = products;

                // If OpenWidget has a specific API method once loaded:
                if (window.OpenWidget) {
                    window.OpenWidget.on('ready', function () {
                        try {
                            window.OpenWidget.call('setWidgetContent', { product_recommendations: products });
                        } catch (e) {
                            console.log("OpenWidget specific call not supported or failed", e);
                        }
                    });
                }

                console.log("OpenWidget product recommendations loaded", products.length, "items.");

            } catch (e) {
                console.error("Failed to load OpenWidget recommendations", e);
            }
        }

        // Initialize OpenWidget Recommendations
        loadOpenWidgetRecommendations();
    </script>
