        .topbar-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100px;
            z-index: 9999;
            background: #000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

        .topbar-container:active { cursor: grabbing; }
        .ticker-wrapper { display: flex; align-items: center; width: max-content; height: 100%; will-change: transform; }
        .ticker-item {
            flex-shrink: 0; width: 240px; height: 100%;

            text-decoration: none; border-right: 1px solid rgba(255, 255, 255, 0.05);
            background: #111;

        .item-image {
            position: absolute; inset: 0; width: 100%; height: 100%;

        .item-content {
            position: relative; z-index: 2; width: 100%; height: 100%;

        .logo-box {
            position: absolute; top: 8px; left: 8px; width: 32px; height: 32px;

            transform: scale(0.7); transform-origin: top left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10;

    <!-- Ticker Logic Scripts -->
    <script>
        const API_URL = '/card.json';
        let tickerLoop;

        async function initTicker() {
            if (typeof gsap === 'undefined') { return setTimeout(initTicker, 50); }
            try {
                const res = await fetch(API_URL + '?t=' + Date.now());
                const data = await res.json();
                
                let items = [];
                if (Array.isArray(data)) items = data;
                else if (typeof data === 'object') {
                    items = Object.values(data).find(v => Array.isArray(v)) || [data];
                }

                if (items.length === 0) return;

                const wrapper = document.getElementById('tickerWrapper');
                wrapper.innerHTML = '';

                // Create 3 sets for smooth infinite scroll
                const tickerData = [...items, ...items, ...items];
                const frag = document.createDocumentFragment();

                tickerData.forEach((item) => {
                    const a = document.createElement('a');
                    a.href = item.url || '#';
                    a.target = "_blank";
                    a.className = 'ticker-item';
                    a.innerHTML = `
                        <img src="${item.image}" class="item-image" loading="lazy" decoding="async">
                        <div class="logo-box">
                            <img src="${item.logo}" class="w-full h-full object-contain" onerror="this.src='https://www.google.com/s2/favicons?sz=64&domain=google.com'">
                        </div>
                        <div class="item-content">
                            <span class="text-[10px] font-bold text-white truncate drop-shadow-md">${item.name || 'Untitled'}</span>
                            <span class="text-[8px] text-slate-300 truncate opacity-80">${item.tagline || ''}</span>
                        </div>
                    `;
                    frag.appendChild(a);
                });
                wrapper.appendChild(frag);

                startTickerAnimation();
            } catch (e) {
                console.error("Ticker load fail", e);
            }
        }

        function startTickerAnimation() {
            const items = gsap.utils.toArray(".ticker-item");
            tickerLoop = horizontalLoop(items, { repeat: -1, speed: 0.35, draggable: true });
            gsap.ticker.add(updateTickerEffects);
        }

        function updateTickerEffects() {
            const items = gsap.utils.toArray(".ticker-item");
            const centerX = window.innerWidth / 2;
            const threshold = 220;

            items.forEach(item => {
                const rect = item.getBoundingClientRect();
                if (rect.right < -100 || rect.left > window.innerWidth + 100) return;

                const itemCenter = rect.left + rect.width / 2;
                const dist = Math.abs(centerX - itemCenter);
                const img = item.querySelector('.item-image');
                const content = item.querySelector('.item-content');
                const logo = item.querySelector('.logo-box');

                if (dist < threshold) {
                    const ratio = 1 - (dist / threshold);
                    gsap.set(img, { opacity: 0.4 + (0.6 * ratio) });
                    gsap.set(content, { y: -5 * ratio, opacity: 1 });
                    gsap.set(logo, { scale: 0.7 + (0.2 * ratio) });
                    item.style.zIndex = "10";
                } else {
                    gsap.set(img, { opacity: 0.4 });
                    gsap.set(content, { y: 0, opacity: 0.7 });
                    gsap.set(logo, { scale: 0.7 });
                    item.style.zIndex = "1";
                }
            });
        }

        // GSAP Horizontal Loop Helper
        function horizontalLoop(items, config) {
            items = gsap.utils.toArray(items);
            config = config || {};
            let tl = gsap.timeline({repeat: config.repeat, paused: config.paused, defaults: {ease: "none"}, onReverseComplete: () => tl.totalTime(tl.rawTime() + tl.duration() * 100)}),
                length = items.length, startX = items[0].offsetLeft, times = [], widths = [], xPercents = [],
                curIndex = 0, pixelsPerSecond = (config.speed || 1) * 100,
                snap = config.snap === false ? v => v : gsap.utils.snap(config.snap || 1),
                totalWidth, curX, distanceToStart, distanceToLoop, item, i;
            gsap.set(items, { xPercent: (i, target) => {
                let w = widths[i] = parseFloat(gsap.getProperty(target, "width", "px"));
                xPercents[i] = snap(parseFloat(gsap.getProperty(target, "xPercent", "%")) + (gsap.getProperty(target, "x", "px") / w) * 100);
                return xPercents[i];
            }});
            gsap.set(items, {x: 0});
            totalWidth = items[length-1].offsetLeft + xPercents[length-1] / 100 * widths[length-1] - startX + items[length-1].offsetWidth * gsap.getProperty(items[length-1], "scaleX") + (parseFloat(config.paddingRight) || 0);
            for (i = 0; i < length; i++) {
                item = items[i]; curX = xPercents[i] / 100 * widths[i];
                distanceToStart = item.offsetLeft - startX; distanceToLoop = distanceToStart + widths[i] * gsap.getProperty(item, "scaleX");
                tl.to(item, {xPercent: snap((curX - distanceToLoop) / widths[i] * 100), duration: distanceToLoop / pixelsPerSecond}, 0)
                  .fromTo(item, {xPercent: snap((curX - distanceToLoop + totalWidth) / widths[i] * 100)}, {xPercent: xPercents[i], duration: (curX - distanceToLoop + totalWidth - curX) / pixelsPerSecond, immediateRender: false}, distanceToLoop / pixelsPerSecond);
            }
            if (config.draggable && typeof(Draggable) !== "undefined") {
                let proxy = document.createElement("div"), ratio, invRatio, update = () => tl.progress(gsap.utils.wrap(0, 1, parseFloat(gsap.getProperty(proxy, "x")) * ratio));
                Draggable.create(proxy, { trigger: "#topbar", type: "x", onPress() { this.startProgress = tl.progress(); tl.pause(); ratio = 1 / totalWidth; invRatio = totalWidth; gsap.set(this.target, {x: this.startProgress * invRatio}); }, onDrag: update, onThrowUpdate: update, onRelease: () => tl.play(), inertia: true });
            }
            return tl;
        }

        window.addEventListener('DOMContentLoaded', initTicker);
    </script>
