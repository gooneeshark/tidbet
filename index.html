            function updateSafeTop() {
                var nav = document.getElementById('goonav-root') || document.querySelector('[id^="goonav"]');
                if (!nav) return;
                var h = nav.getBoundingClientRect().height;
                document.documentElement.style.setProperty('--goo-topbar-safe-top', h + 'px');
            }
            // Watch for goo-nav injection
            var obs = new MutationObserver(function () {
                updateSafeTop();
                var nav = document.getElementById('goonav-root') || document.querySelector('[id^="goonav"]');
                if (nav) {
                    new ResizeObserver(updateSafeTop).observe(nav);
                    obs.disconnect();
                }
            });
            obs.observe(document.documentElement, { childList: true, subtree: true });
            window.addEventListener('load', updateSafeTop);
            window.addEventListener('resize', updateSafeTop);
        })();
    </script>
